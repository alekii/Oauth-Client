server:
  port: 8098
  forward-headers-strategy: framework
  servlet:
    context-path: /security
spring:
  config:
    import: optional:classpath:env.properties
  security:
    user:
      name: admin
      password: password

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    supported-submit-methods:
      - get
      - post
    disable-swagger-default-url: true
  packages-to-scan:
    - com.oauth2_client

keycloak:
  auth-server-url: ${KEYCLOAK_BASE_URL:http://iam21.me.co.ke}